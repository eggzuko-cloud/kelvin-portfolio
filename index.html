<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelvin Leung Game Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Klee+One:wght@600&display=swap">
<style id="app-style">
:root{
  --surface-white:#ffffff;
  --surface-blush:#fff1f1;
  --surface-cream:#f9f5f1;
  --surface-ink:#24212b;
  --surface-plum:#2d1e2c;
  --surface-plum-light:#5e3b5b;
  --surface-placeholder:#d9d9d9;

  --bg:#ffffff;
  --bg-band:#fff1f1;
  --bg-card:#ffffff;
  --bg-sunken:#f9f5f1;
  --bg-field:#ffffff;

  --ink-900:#1a1a1a;
  --ink-800:#34303e;
  --ink-700:#656171;
  --ink-500:#666666;
  --ink-400:#adacac;
  --ink-300:#d2d2d7;

  --text-heading:#34303e;
  --text-body:#666666;
  --text-muted:#adacac;
  --text-on-dark:#ffffff;

  --crimson:#ff0048;
  --crimson-soft:#ff5f76;
  --red:#dd1818;
  --red-strong:#bd0202;
  --red-bright:#ff3838;
  --gold-200:#f4dd89;
  --gold-600:#a88450;
  --gold-800:#b07515;

  --line-100:#efefef;
  --line-200:#dadada;
  --line-300:#adacac;

  --grad-cta:linear-gradient(90deg,#FF3838 15%,#BD0202 100%);
  --grad-crimson:linear-gradient(90deg,#FF5F76 0%,#FF0048 100%);
  --grad-gold:linear-gradient(90deg,#F4DD89 0%,#A88450 100%);

  --shadow-card:0 0 16px 4px rgba(214,196,196,0.3);
  --hairline:inset 0 0 0 1px #dadada;
  --hairline-soft:inset 0 0 0 1px #efefef;

  --r-sm:12px;
  --r-md:20px;
  --r-lg:32px;
  --r-pill:100px;

  --ease:cubic-bezier(0.4,0,0.2,1);
  --dur-fast:120ms;
  --dur:180ms;
  --dur-slow:280ms;

  --font-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-ui:"Inter",system-ui,-apple-system,sans-serif;
  --font-hand:"Klee One","Hiragino Kaku Gothic ProN",cursive;

  --ok:#2e7d32;
  --warn:#b45309;
  --off:#656171;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a22;
    --bg-band:#221e28;
    --bg-card:#272430;
    --bg-sunken:#221f2a;
    --bg-field:#2f2b38;

    --text-heading:#f4f1f6;
    --text-body:#c2bdcb;
    --text-muted:#8e8899;
    --ink-800:#f4f1f6;
    --ink-700:#c2bdcb;
    --ink-500:#a9a3b4;
    --ink-400:#8e8899;
    --ink-300:#4a4556;

    --crimson:#ff5f81;
    --crimson-soft:#ff8ea0;
    --red:#ff6b6b;
    --red-strong:#ff3838;

    --line-100:#37333f;
    --line-200:#45404f;
    --line-300:#5e5870;

    --shadow-card:0 0 16px 4px rgba(0,0,0,0.35);
    --hairline:inset 0 0 0 1px #45404f;
    --hairline-soft:inset 0 0 0 1px #37333f;

    --gold-600:#d7b476;
    --gold-800:#e0c184;
    --ok:#6ec177;
    --warn:#e0a458;
    --off:#8e8899;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a22;
  --bg-band:#221e28;
  --bg-card:#272430;
  --bg-sunken:#221f2a;
  --bg-field:#2f2b38;

  --text-heading:#f4f1f6;
  --text-body:#c2bdcb;
  --text-muted:#8e8899;
  --ink-800:#f4f1f6;
  --ink-700:#c2bdcb;
  --ink-500:#a9a3b4;
  --ink-400:#8e8899;
  --ink-300:#4a4556;

  --crimson:#ff5f81;
  --crimson-soft:#ff8ea0;
  --red:#ff6b6b;
  --red-strong:#ff3838;

  --line-100:#37333f;
  --line-200:#45404f;
  --line-300:#5e5870;

  --shadow-card:0 0 16px 4px rgba(0,0,0,0.35);
  --hairline:inset 0 0 0 1px #45404f;
  --hairline-soft:inset 0 0 0 1px #37333f;

  --gold-600:#d7b476;
  --gold-800:#e0c184;
  --ok:#6ec177;
  --warn:#e0a458;
  --off:#8e8899;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text-body);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:var(--red);text-decoration:none}
a:hover{color:var(--red-strong);text-decoration:underline}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

.wrap{max-width:1050px;margin:0 auto;padding-inline:20px}

/* ---------- save toast (editor only) ---------- */
.toast{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;
  background:var(--surface-ink);color:#fff;border-radius:var(--r-pill);
  padding:9px 18px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px -4px rgba(24,39,75,0.28);
  opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.toast.show{opacity:1;transform:none}
.toast[data-tone="error"]{background:var(--red-strong)}

.btn{
  border:0;border-radius:var(--r-pill);padding:9px 18px;font-size:14px;font-weight:600;
  cursor:pointer;transition:filter var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
  background:var(--grad-cta);color:#fff;box-shadow:inset 0 0 0 1px rgba(218,28,28,0.9);
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(0.98)}
.btn-ghost{
  background:transparent;color:var(--text-heading);box-shadow:var(--hairline);
}
.btn-ghost:hover{filter:none;color:var(--crimson);box-shadow:inset 0 0 0 2px var(--crimson)}
.btn-sm{padding:7px 14px;font-size:13px}

/* ---------- hero ---------- */
.hero{padding-block:72px 48px}
.eyebrow{
  font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--crimson);margin:0 0 12px;
}
h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(34px,6vw,54px);line-height:1.08;letter-spacing:-0.03em;
  color:var(--text-heading);margin:0 0 16px;text-wrap:balance;
}
.hero-lead{
  font-size:19px;line-height:1.55;max-width:60ch;color:var(--text-body);margin:0 0 28px;
}
.hero-lead strong{color:var(--text-heading);font-weight:600}
.statrow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.stat{
  background:var(--bg-card);border-radius:var(--r-md);box-shadow:var(--hairline-soft);
  padding:14px 20px;min-width:118px;
}
.stat b{
  display:block;font-family:var(--font-display);font-weight:700;font-size:26px;
  line-height:1.1;color:var(--text-heading);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;
}
.stat span{display:block;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);margin-top:4px;font-weight:600}
.contacts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--text-body);margin:0}
.contacts a{font-weight:500}
.contacts + .contacts{margin-top:9px}

/* ---------- filters ---------- */
.filters{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-block:20px;border-top:1px solid var(--line-100);
}
.filters-label{
  font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-right:6px;
}
.chip{
  border:0;background:transparent;box-shadow:var(--hairline);
  border-radius:var(--r-pill);padding:7px 15px;font-size:13px;font-weight:600;
  color:var(--text-body);cursor:pointer;
  transition:color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease);
}
.chip:hover{color:var(--crimson);box-shadow:inset 0 0 0 1px var(--crimson)}
.chip[aria-pressed="true"]{background:var(--grad-crimson);color:#fff;box-shadow:none}
.chip .n{opacity:0.6;margin-left:6px;font-variant-numeric:tabular-nums}

/* ---------- eras ---------- */
.era{padding-block:56px}
.era.band{background:var(--bg-band)}
.era-head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;margin-bottom:8px}
.era-head h2{
  font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.4vw,32px);
  letter-spacing:-0.02em;color:var(--text-heading);margin:0;text-wrap:balance;
}
.era-dates{
  font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.era-role{font-size:15px;color:var(--text-body);margin:0 0 20px;max-width:70ch}
.era-impact{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.impact-chip{
  font-size:13px;font-weight:600;color:var(--text-heading);
  background:var(--bg-card);border-radius:var(--r-pill);padding:6px 14px;
  box-shadow:var(--hairline-soft);
}
.impact-chip i{font-style:normal;color:var(--crimson);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- grid + card ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.grid[data-cols="1"]{max-width:600px}
@media (min-width:720px){
  .grid[data-cols="2"],.grid[data-cols="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1000px){
  .grid[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.card{
  background:var(--bg-card);border-radius:var(--r-md);box-shadow:var(--shadow-card),var(--hairline-soft);
  overflow:hidden;display:flex;flex-direction:column;
  container-type:inline-size;
}
.cover{
  aspect-ratio:16/9;max-width:100%;position:relative;
  background:linear-gradient(140deg,#2d1e2c 0%,#24212b 55%,#3a2d3a 100%);
  display:block;
}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
/* The tag sits over artwork of any brightness, so it carries its own
   dark chip rather than relying on the image behind it. */
.cover-tag{
  position:absolute;left:12px;bottom:12px;z-index:2;max-width:calc(100% - 24px);
  font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.16em;
  text-transform:uppercase;color:#fff;
  background:rgba(0,0,0,0.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding:5px 11px;border-radius:var(--r-pill);line-height:1.35;
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}

/* ---------- screenshot carousel inside the cover ---------- */
.shots{
  display:flex;height:100%;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  scrollbar-width:none;-ms-overflow-style:none;
}
.shots::-webkit-scrollbar{display:none}
.shots.dragging{scroll-behavior:auto;cursor:grabbing}
.shot{
  flex:0 0 100%;scroll-snap-align:center;height:100%;
  border:0;padding:0;margin:0;background:transparent;cursor:zoom-in;display:block;
}
.shot{position:relative}
.shot img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.shots.dragging .shot{cursor:grabbing}

.play-badge{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,0.94);box-shadow:0 4px 20px rgba(0,0,0,0.55);
  display:grid;place-items:center;pointer-events:none;
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);
}
.play-badge i{
  width:0;height:0;margin-left:5px;
  border-left:21px solid #24212b;
  border-top:13px solid transparent;border-bottom:13px solid transparent;
}
.shot:hover .play-badge{transform:translate(-50%,-50%) scale(1.07);background:#fff}
.play-label{
  position:absolute;left:14px;top:12px;z-index:2;
  font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:#fff;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:var(--r-pill);
  pointer-events:none;
}

/* Full-height columns: the whole left/right edge scrolls, not just the chip. */
.cov-col{
  position:absolute;top:0;bottom:0;z-index:3;
  width:30%;min-width:68px;max-width:140px;
  border:0;padding:0 12px;margin:0;cursor:pointer;
  display:flex;align-items:center;
  -webkit-tap-highlight-color:transparent;
  transition:opacity var(--dur) var(--ease);
}
.cov-col.prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,0.5),rgba(0,0,0,0))}
.cov-col.next{right:0;justify-content:flex-end;background:linear-gradient(270deg,rgba(0,0,0,0.5),rgba(0,0,0,0))}
.cov-col[disabled]{opacity:0;pointer-events:none}
.cov-col i{
  width:46px;height:46px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,0.95);color:#24212b;
  display:grid;place-items:center;
  font-style:normal;font-size:26px;font-weight:700;line-height:0.9;
  box-shadow:0 2px 12px rgba(0,0,0,0.5);
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);
}
.cov-col:hover i{background:#fff;transform:scale(1.07)}
.cov-col:active i{transform:scale(0.95)}

.cov-dots{
  position:absolute;right:12px;bottom:12px;z-index:4;display:flex;gap:7px;align-items:center;
  padding:7px 11px;border-radius:var(--r-pill);background:rgba(0,0,0,0.55);pointer-events:none;
}
.cov-dots i{
  width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.5);
  transition:background var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.cov-dots i.on{background:#fff;transform:scale(1.2)}

.shot-del{
  position:absolute;top:10px;right:10px;z-index:6;width:34px;height:34px;border-radius:50%;
  border:0;background:rgba(0,0,0,0.65);color:#fff;font-size:18px;line-height:1;cursor:pointer;
  display:grid;place-items:center;opacity:0;transition:opacity var(--dur) var(--ease),background var(--dur) var(--ease);
}
.cover:hover .shot-del,.shot-del:focus-visible{opacity:1}
.shot-del:hover{background:var(--red-strong)}
@media (hover:none){ .shot-del{opacity:1} }

/* ---------- lightbox ---------- */
dialog.lb{
  border:0;padding:0;margin:0;width:100%;height:100%;max-width:100vw;max-height:100vh;
  background:transparent;overflow:hidden;
}
dialog.lb::backdrop{background:rgba(16,13,20,0.94)}
.lb-stage{
  position:fixed;inset:0;display:grid;place-items:center;padding:72px 22px 76px;
  background:rgba(16,13,20,0.95);touch-action:pinch-zoom;
}
.lb-stage img,.lb-stage video{
  max-width:min(94vw,1400px);max-height:78vh;object-fit:contain;display:block;
  border-radius:8px;box-shadow:0 24px 60px -12px rgba(0,0,0,0.7);
  -webkit-user-drag:none;user-select:none;
}
.lb-stage video{background:#000}
.lb-stage [hidden]{display:none!important}
.lb-fallback{
  max-width:min(88vw,420px);text-align:center;color:rgba(255,255,255,0.86);
  font-size:14px;line-height:1.6;margin:0;
}
.lb-fallback a{
  display:inline-block;margin-top:12px;color:#fff;font-weight:600;
  background:rgba(255,255,255,0.16);padding:9px 18px;border-radius:var(--r-pill);
  text-decoration:none;
}
.lb-fallback a:hover{background:rgba(255,255,255,0.26);text-decoration:none}
/* Same full-height column target as the card carousel. */
.lb-col{
  position:fixed;top:0;bottom:0;z-index:3;
  width:24%;min-width:84px;max-width:230px;
  border:0;padding:0 18px;margin:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;-webkit-tap-highlight-color:transparent;
}
.lb-col.lb-prev{left:0;justify-content:flex-start}
.lb-col.lb-next{right:0;justify-content:flex-end}
.lb-col[disabled]{opacity:0;pointer-events:none}
.lb-col i{
  width:60px;height:60px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,0.94);color:#18151e;
  display:grid;place-items:center;
  font-style:normal;font-size:34px;font-weight:700;line-height:0.9;
  box-shadow:0 4px 20px rgba(0,0,0,0.55);
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);
}
.lb-col:hover i{background:#fff;transform:scale(1.07)}
.lb-col:active i{transform:scale(0.95)}
.lb-btn{
  position:fixed;z-index:4;border:0;cursor:pointer;color:#18151e;background:rgba(255,255,255,0.92);
  border-radius:50%;width:52px;height:52px;display:grid;place-items:center;font-size:26px;line-height:1;
  box-shadow:0 4px 20px rgba(0,0,0,0.55);
  transition:background var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.lb-btn:hover{background:#fff;transform:scale(1.06)}
.lb-close{top:18px;right:18px}
.lb-cap{
  position:fixed;left:0;right:0;bottom:18px;text-align:center;
  font-size:13px;font-weight:500;letter-spacing:0.02em;
  pointer-events:none;
}
.lb-cap span{
  display:inline-block;max-width:min(92vw,700px);
  color:rgba(255,255,255,0.86);
  background:rgba(0,0,0,0.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding:6px 14px;border-radius:var(--r-pill);
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}
.lb-cap b{color:#fff;font-weight:600}
.card-body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1 1 auto}
.card-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{
  font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;
  color:var(--text-heading);margin:0;line-height:1.25;
}
.card-meta{font-size:13px;color:var(--text-muted);margin:3px 0 0;font-weight:500}
.pill{
  font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap;flex:0 0 auto;
}
.pill-live{color:var(--ok);box-shadow:inset 0 0 0 1px currentColor}
.pill-sunset{color:var(--off);box-shadow:inset 0 0 0 1px currentColor}
.pill-internal{color:var(--gold-800);box-shadow:inset 0 0 0 1px currentColor}
.pill-delisted{color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}
.card-desc{font-size:14.5px;line-height:1.55;margin:0;color:var(--text-body)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{
  background:var(--bg-sunken);border-radius:var(--r-sm);padding:9px 11px;min-width:0;
}
.kpi b{
  display:block;font-family:var(--font-display);font-weight:700;font-size:16px;
  color:var(--text-heading);letter-spacing:-0.01em;font-variant-numeric:tabular-nums;line-height:1.2;
}
.kpi span{
  display:block;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--text-muted);font-weight:600;margin-top:3px;
  overflow-wrap:normal;word-break:normal;hyphens:none;   /* never split a word */
}
.kpi-none{font-size:13px;color:var(--text-muted);font-style:italic;margin:0}
/* Three across in a narrow card leaves each chip too little room for a word
   like REGISTERED, so the chips drop to two columns and the odd one out
   takes the full width rather than having its label snapped in half. */
@container (max-width:400px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3):last-child{grid-column:1/-1}
}

.card-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;margin-top:auto}
/* Both drawers wear a chevron so the reader knows they open in place; the
   role one carries the CTA gradient because it is the card's real claim. */
.chev{
  font-style:normal;font-size:10px;line-height:1;display:inline-block;
  margin-left:2px;vertical-align:1px;
  transition:transform var(--dur) var(--ease);
}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.btn-role{
  background:var(--grad-cta);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(218,28,28,0.9);
}
.btn-role:hover{filter:brightness(1.06);color:#fff;box-shadow:inset 0 0 0 1px rgba(218,28,28,0.9)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}

/* ---------- work-sample strip ---------- */
.sample{
  display:flex;gap:20px;align-items:center;flex-wrap:wrap;
  background:var(--bg-card);border-radius:var(--r-md);
  box-shadow:var(--shadow-card),var(--hairline-soft);
  padding:20px 24px;margin-bottom:28px;
}
.sample-mark{
  flex:0 0 auto;width:66px;height:66px;border-radius:var(--r-sm);
  background:linear-gradient(140deg,#2d1e2c 0%,#24212b 60%,#3a2d3a 100%);
  display:grid;place-items:center;
}
.sample-body{flex:1 1 300px;min-width:0}
.sample-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gold-800);margin:0 0 5px;
}
.sample h3{
  font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.01em;
  color:var(--text-heading);margin:0 0 6px;
}
.sample p{margin:0;font-size:14.5px;line-height:1.55}
.sample-note{display:block;margin-top:6px;font-size:13px;color:var(--text-muted)}
.sample-cta{flex:0 0 auto}
@media (max-width:640px){.sample{padding:18px}.sample-cta{width:100%}.sample-cta .btn{width:100%;justify-content:center}}

/* ---------- detail ---------- */
.detail{border-top:1px solid var(--line-100);padding:20px;display:grid;gap:22px;background:var(--bg-sunken);container-type:inline-size}
.detail[hidden]{display:none!important}
.dsec > h4{
  font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--crimson);margin:0 0 10px;
}
.dsec p{margin:0 0 10px;font-size:14.5px;line-height:1.6}
.dsec p:last-child{margin-bottom:0}
.facts{width:100%;border-collapse:collapse;font-size:13.5px}
.facts th,.facts td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line-100);vertical-align:top}
.facts th{font-weight:600;color:var(--text-heading);width:38%;min-width:5.5em}
.facts td{color:var(--text-body);font-variant-numeric:tabular-nums}
.facts tr:last-child th,.facts tr:last-child td{border-bottom:0}
/* In a three-across row the card is too narrow for two columns, so the
   label moves above its value and each fact reads in two lines. */
@container (max-width:360px){
  .facts,.facts tbody,.facts tr,.facts th,.facts td{display:block;width:auto}
  .facts tr{padding:8px 0;border-bottom:1px solid var(--line-100)}
  .facts tr:last-child{border-bottom:0;padding-bottom:0}
  .facts tr:first-child{padding-top:0}
  .facts th,.facts td{padding:0;border-bottom:0;min-width:0}
  .facts th{color:var(--text-muted);font-size:12px;letter-spacing:0.04em}
}
.src{font-size:12px;color:var(--text-muted);margin:10px 0 0;line-height:1.5}
.src a{color:var(--text-muted);text-decoration:underline}
.src a:hover{color:var(--crimson)}
.cvlist{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.cvlist li{margin-bottom:6px}
.cvlist li::marker{color:var(--crimson)}
.pt-row{display:flex;gap:8px;align-items:flex-start}
.pt-row > span{flex:1 1 auto;min-width:0}
.cvlist [data-pt]:empty::before{content:"Write a point…";color:var(--text-muted)}
.pt-del{
  flex:0 0 auto;border:0;background:transparent;color:var(--text-muted);cursor:pointer;
  font-size:16px;line-height:1.4;padding:0 4px;border-radius:4px;
  opacity:0;transition:opacity var(--dur) var(--ease),color var(--dur) var(--ease);
}
.cvlist li:hover .pt-del,.pt-del:focus-visible{opacity:1}
.pt-del:hover{color:var(--red-strong)}
.addpt{margin-top:10px}
@media (hover:none){ .pt-del{opacity:1} }


.storelinks{display:flex;flex-wrap:wrap;gap:8px}
.storelink{
  font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--r-pill);
  box-shadow:var(--hairline);color:var(--text-heading);
  transition:box-shadow var(--dur) var(--ease),color var(--dur) var(--ease);
}
.storelink:hover{text-decoration:none;color:var(--crimson);box-shadow:inset 0 0 0 2px var(--crimson)}

.pagefoot{padding-block:40px 56px;border-top:1px solid var(--line-100)}
.pagefoot p{font-size:13.5px;color:var(--text-muted);margin:0}

/* Editable copy, author view only. A viewer copy carries no [data-edit]
   attributes at all, so none of this can apply there. */
[data-edit]{
  outline:none;border-radius:3px;
  transition:outline-color var(--dur) var(--ease),background var(--dur) var(--ease);
  outline:1px dashed transparent;outline-offset:3px;cursor:text;
}
[data-edit]:hover{outline-color:var(--crimson-soft)}
[data-edit]:focus{
  outline:2px solid var(--crimson);outline-offset:3px;
  background:color-mix(in srgb, var(--crimson) 7%, transparent);
}
[data-edit]:empty::before{content:"—";color:var(--text-muted)}
.cover [data-edit]:hover,.cover [data-edit]:focus{outline-offset:2px}

/* Author-only strip. Absent from a viewer copy, and from anyone else's view. */
.ownerbar{background:var(--surface-ink);color:rgba(255,255,255,0.75)}
.ownerbar-in{
  display:flex;gap:20px;align-items:center;justify-content:space-between;
  flex-wrap:wrap;padding-block:22px;
}
.ownerbar p{margin:0;font-size:13.5px;line-height:1.6;max-width:62ch}
.ownerbar b{color:#fff;font-weight:600}
.ownerbar .btn{flex:0 0 auto}

.empty{padding:48px 0;text-align:center;color:var(--text-muted);font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .hero{padding-block:40px 32px}
  .era{padding-block:40px}
  .grid{grid-template-columns:1fr;gap:20px}
  .stat{flex:1 1 calc(50% - 6px);min-width:0}
  .facts th{width:auto;min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:0.01ms!important;animation-duration:0.01ms!important}
}

/* ------------------------------------------------------------------

------------------------------------------------------------------ */
function readState(){
  try{
    var el = document.getElementById("app-state");
    var s = JSON.parse(el.textContent || "{}");
    return { roles: s.roles || {}, shots: s.shots || {}, text: s.text || {},
             points: s.points || {}, hidden: s.hidden || {} };
  }catch(e){ return { roles:{}, shots:{}, text:{}, points:{}, hidden:{} }; }
}
var STATE = readState();

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function el(id){ return document.getElementById(id); }

/* ------------------------------------------------------------------
   Editable copy. Every piece of prose on the page renders through T(),
   which prefers the author's override. ed() turns it into an editable
   field — but only for the author; a viewer copy emits neither.
------------------------------------------------------------------ */
function T(key, fallback){
  var v = STATE.text ? STATE.text[key] : null;
  return (v == null || v === "") ? fallback : v;
}
function ed(){return "";}
/* Text with an override applied AND wired for editing, escaped. */
function E(key, fallback){ return esc(T(key, fallback)); }
function pname(p){ return T("proj." + p.id + ".name", p.name); }
function stateBytes(){ try{ return JSON.stringify(STATE).length; }catch(e){ return 0; } }

function setSave(tone, text){
  var c = el("toast");
  if(!c) return;
  c.dataset.tone = tone;
  c.textContent = text;
  c.classList.add("show");
  clearTimeout(setSave._t);
  if(tone !== "saving"){
    setSave._t = setTimeout(function(){ c.classList.remove("show"); }, tone === "error" ? 4500 : 1700);
  }
}

/* ------------------------------------------------------------------
   Cover art — generated motifs, on the system's ink / plum ground.
   Gold marks flagship and in-house economy work; crimson the rest.
------------------------------------------------------------------ */
function cover(p){
  var gold = p.accent === "gold";
  var a = gold ? "#f4dd89" : "#ff0048";
  var b = gold ? "#a88450" : "#ff5f76";
  var g = "g_" + p.id;
  var parts = [];
  parts.push('<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="' + a + '" stop-opacity="0.95"/>'
    + '<stop offset="1" stop-color="' + b + '" stop-opacity="0.65"/></linearGradient></defs>');
  var f = 'url(#' + g + ')';
  var m = p.motif;

  if(m === "cascade"){
    /* 6×5 grid, top row fading as it drops away */
    for(var cy=0;cy<5;cy++){
      for(var cx=0;cx<6;cx++){
        var op = cy === 0 ? 0.18 : (((cx + cy) % 4 === 0) ? 0.9 : 0.32);
        parts.push('<rect x="' + (94 + cx*16) + '" y="' + (16 + cy*16) + '" width="13" height="13" rx="4" fill="' + f + '" opacity="' + op + '"/>');
      }
    }
    parts.push('<path d="M72 44 L80 52 L72 60" fill="none" stroke="' + f + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" transform="rotate(90 76 52)"/>');
    parts.push('<path d="M200 44 L208 52 L200 60" fill="none" stroke="' + f + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" transform="rotate(90 204 52)"/>');
  } else if(m === "slot"){
    for(var i=0;i<3;i++){
      parts.push('<rect x="' + (44 + i*46) + '" y="22" width="36" height="76" rx="8" fill="none" stroke="' + f + '" stroke-width="2" opacity="0.8"/>');
      for(var j=0;j<3;j++){
        parts.push('<circle cx="' + (62 + i*46) + '" cy="' + (38 + j*26) + '" r="' + (j===1?7:5) + '" fill="' + f + '" opacity="' + (j===1?0.95:0.4) + '"/>');
      }
    }
    parts.push('<rect x="182" y="34" width="30" height="52" rx="7" fill="' + f + '" opacity="0.22"/>');
    parts.push('<text x="197" y="66" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="17" font-weight="700" fill="' + f + '">×</text>');
  } else if(m === "wheel"){
    parts.push('<circle cx="140" cy="60" r="44" fill="none" stroke="' + f + '" stroke-width="2" opacity="0.85"/>');
    for(var k=0;k<8;k++){
      var ang = (k/8)*Math.PI*2;
      parts.push('<line x1="140" y1="60" x2="' + (140+Math.cos(ang)*44).toFixed(1) + '" y2="' + (60+Math.sin(ang)*44).toFixed(1) + '" stroke="' + f + '" stroke-width="1.5" opacity="0.45"/>');
      parts.push('<circle cx="' + (140+Math.cos(ang)*30).toFixed(1) + '" cy="' + (60+Math.sin(ang)*30).toFixed(1) + '" r="' + (k===0?6:4) + '" fill="' + f + '" opacity="' + (k===0?0.95:0.45) + '"/>');
    }
    parts.push('<circle cx="140" cy="60" r="7" fill="' + f + '"/>');
  } else if(m === "cards"){
    var rot = [-16,-5,7,19];
    for(var c=0;c<4;c++){
      parts.push('<g transform="rotate(' + rot[c] + ' 140 74)"><rect x="' + (104 + c*18) + '" y="18" width="46" height="66" rx="7" fill="none" stroke="' + f + '" stroke-width="2" opacity="' + (0.35 + c*0.2) + '"/></g>');
    }
    parts.push('<circle cx="140" cy="52" r="6" fill="' + f + '"/>');
  } else if(m === "puzzle"){
    for(var r=0;r<3;r++){
      for(var q=0;q<5;q++){
        var on = (r+q)%3 === 0;
        parts.push('<rect x="' + (74 + q*28) + '" y="' + (26 + r*28) + '" width="20" height="20" rx="6" fill="' + f + '" opacity="' + (on?0.9:0.22) + '"/>');
      }
    }
    parts.push('<path d="M84 36 L140 64 L196 36" fill="none" stroke="' + f + '" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>');
  } else if(m === "rpg"){
    parts.push('<path d="M140 16 L150 46 L182 46 L156 66 L166 98 L140 78 L114 98 L124 66 L98 46 L130 46 Z" fill="none" stroke="' + f + '" stroke-width="2" opacity="0.85"/>');
    parts.push('<path d="M140 34 L146 50 L162 50 L149 61 L154 78 L140 67 L126 78 L131 61 L118 50 L134 50 Z" fill="' + f + '" opacity="0.5"/>');
    parts.push('<circle cx="72" cy="30" r="3" fill="' + f + '" opacity="0.6"/><circle cx="208" cy="40" r="4" fill="' + f + '" opacity="0.5"/><circle cx="198" cy="88" r="2.5" fill="' + f + '" opacity="0.7"/>');
  } else if(m === "space"){
    parts.push('<circle cx="140" cy="60" r="34" fill="none" stroke="' + f + '" stroke-width="2" opacity="0.8"/>');
    parts.push('<ellipse cx="140" cy="60" rx="58" ry="20" fill="none" stroke="' + f + '" stroke-width="1.5" opacity="0.5" transform="rotate(-18 140 60)"/>');
    parts.push('<ellipse cx="140" cy="60" rx="72" ry="26" fill="none" stroke="' + f + '" stroke-width="1" opacity="0.3" transform="rotate(-18 140 60)"/>');
    parts.push('<circle cx="196" cy="44" r="5" fill="' + f + '"/><circle cx="86" cy="80" r="3.5" fill="' + f + '" opacity="0.7"/>');
  } else { /* chat */
    parts.push('<rect x="62" y="24" width="94" height="50" rx="16" fill="none" stroke="' + f + '" stroke-width="2" opacity="0.8"/>');
    parts.push('<path d="M84 74 L84 90 L102 74 Z" fill="' + f + '" opacity="0.8"/>');
    parts.push('<rect x="134" y="50" width="86" height="44" rx="14" fill="' + f + '" opacity="0.22"/>');
    parts.push('<circle cx="86" cy="49" r="4.5" fill="' + f + '"/><circle cx="104" cy="49" r="4.5" fill="' + f + '" opacity="0.7"/><circle cx="122" cy="49" r="4.5" fill="' + f + '" opacity="0.45"/>');
    parts.push('<circle cx="158" cy="72" r="4" fill="' + f + '" opacity="0.8"/><circle cx="176" cy="72" r="4" fill="' + f + '" opacity="0.6"/><circle cx="194" cy="72" r="4" fill="' + f + '" opacity="0.4"/>');
  }

  return '<svg viewBox="0 0 280 120" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">'
    + parts.join("") + '</svg>';
}

/* A project's slides are its baked-in media (video clips shipped with the page)
   followed by any screenshots added through the page itself. */
function slidesOf(p){
  var out = (p.media || []).slice();
  var shots = STATE.shots[p.id] || [];
  for(var i=0;i<shots.length;i++) out.push({ kind:"image", src: shots[i], owned:true });
  return out;
}
function mediaCount(p){ return (p.media || []).length; }

/* The cover is the card's hero slot: generated artwork until there is media,
   then a snap-scrolling gallery of it. */
function coverBlock(p){
  var shots = slidesOf(p);
  var h = '<div class="cover">';

  if(!shots.length){
    h += cover(p);
  } else {
    h += '<div class="shots" id="shots-' + esc(p.id) + '" data-shots="' + esc(p.id) + '" tabindex="0" '
       + 'role="group" aria-label="' + esc(p.name) + ' gallery">';
    for(var i=0;i<shots.length;i++){
      var sl = shots[i];
      h += '<button type="button" class="shot" data-open="' + esc(p.id) + '" data-i="' + i + '" '
        + 'aria-label="' + (sl.kind === "video" ? "Play the " : "View ")
        + esc(p.name) + (sl.kind === "video" ? " clip" : " screenshot " + (i+1)) + '">';
      if(sl.kind === "video"){
        h += '<img src="' + esc(mediaSrc(sl.poster)) + '" alt="' + esc(p.name) + ' gameplay clip" loading="lazy">'
          +  '<span class="play-badge" aria-hidden="true"><i></i></span>'
          +  (sl.label ? '<span class="play-label">' + esc(sl.label) + '</span>' : '');
      } else {
        h += '<img src="' + esc(mediaSrc(sl.src)) + '" alt="' + esc(p.name) + ' screenshot" loading="lazy">';
      }
      h += '</button>';
    }
    h += '</div>';

    if(shots.length > 1){
      h += '<button type="button" class="cov-col prev" data-step="-1" data-for="' + esc(p.id) + '" aria-label="Previous screenshot" disabled><i aria-hidden="true">&#8249;</i></button>'
        + '<button type="button" class="cov-col next" data-step="1" data-for="' + esc(p.id) + '" aria-label="Next screenshot"><i aria-hidden="true">&#8250;</i></button>'
        + '<div class="cov-dots" id="dots-' + esc(p.id) + '" aria-hidden="true">';
      for(var d=0;d<shots.length;d++) h += '<i' + (d===0?' class="on"':'') + '></i>';
      h += '</div>';
    }
    /* baked-in media is part of the page, not something to delete from it */
    if(!readOnly && shots.length > mediaCount(p)){
      h += '<button type="button" class="shot-del" data-del="' + esc(p.id) + '" '
        + 'aria-label="Remove the screenshot now showing">&times;</button>';
    }
  }

  h += '<span class="cover-tag"' + ed("proj." + p.id + ".sub") + '>' + E("proj." + p.id + ".sub", p.sub) + '</span></div>';
  return h;
}

/* ------------------------------------------------------------------
   Render
------------------------------------------------------------------ */
function card(p){
  var h = '<article class="card" data-era="' + esc(p.era) + '" data-pid="' + esc(p.id) + '">';
  h += coverBlock(p);
  h += '<div class="card-body">';
  var K = "proj." + p.id;
  h += '<div class="card-top"><div>'
     +   '<h3' + ed(K + ".name") + '>' + E(K + ".name", p.name) + '</h3>'
     +   '<p class="card-meta"' + ed(K + ".meta") + '>' + E(K + ".meta", p.meta) + '</p>'
     + '</div>'
     + '<span class="pill pill-' + esc(p.status) + '"' + ed(K + ".status") + '>' + E(K + ".status", STATUS_LABEL[p.status]) + '</span></div>';
  h += '<p class="card-desc"' + ed(K + ".desc") + '>' + E(K + ".desc", p.desc) + '</p>';

  if(p.kpis && p.kpis.length){
    h += '<div class="kpis">';
    for(var i=0;i<p.kpis.length;i++){
      h += '<div class="kpi">'
        + '<b' + ed(K + ".kpi." + i + ".v") + '>' + E(K + ".kpi." + i + ".v", p.kpis[i].v) + '</b>'
        + '<span' + ed(K + ".kpi." + i + ".l") + '>' + E(K + ".kpi." + i + ".l", p.kpis[i].l) + '</span>'
        + '</div>';
    }
    h += '</div>';
  } else {
    h += '<p class="kpi-none"' + ed(K + ".kpiNone") + '>'
      + E(K + ".kpiNone", "In-house title, distributed inside the host app rather than the app stores.") + '</p>';
  }

  var canExpand = p.expand !== false;

  var acts = [];
  if(p.hasSim){
    acts.push('<a class="btn btn-ghost btn-sm" data-sim="1" href="' + esc(simHref()) + '" target="_blank" rel="noopener noreferrer">Open simulator ↗</a>');
  }
  if(!readOnly){
    acts.push('<button class="btn btn-ghost btn-sm" data-shot="' + esc(p.id) + '">Add screenshot</button>');
  }
  /* Two independent drawers. The store one stays quiet; the role one is the
     card's headline claim, so it carries the same red as the simulator CTA. */
  var hasFacts = !!(p.facts && p.facts.length);
  var hasRole  = roleCount(p) > 0 || !readOnly;
  if(canExpand && hasFacts){

/* ------------------------------------------------------------------
   Holding the page still

   Saving republishes, and a republish reloads this view. Left to the
   browser, that reload lands wherever it likes. So the page tracks its
   own scroll position and puts itself back, and every in-place re-render
   pins the position it started from.
------------------------------------------------------------------ */
var SCROLL_KEY = "klp-scroll";
try{ if("scrollRestoration" in history) history.scrollRestoration = "manual"; }catch(e){}

function rememberScroll(){
  try{ sessionStorage.setItem(SCROLL_KEY, String(Math.round(window.scrollY || 0))); }catch(e){}
}
var scrollTick = null;
window.addEventListener("scroll", function(){
  if(scrollTick) return;
  scrollTick = setTimeout(function(){ scrollTick = null; rememberScroll(); }, 200);
}, {passive: true});
window.addEventListener("pagehide", rememberScroll);
window.addEventListener("beforeunload", rememberScroll);

/* Put the view back where it was before the reload — but give way the
   moment the reader touches the page, so we never fight them for it. */
function restoreScroll(){
  var y;
  try{ y = parseInt(sessionStorage.getItem(SCROLL_KEY) || "", 10); }catch(e){ y = NaN; }
  if(!isFinite(y) || y <= 0) return;

  /* The page is still growing as images and fonts settle, so the target
     is re-checked a few times. "mine" is where we last put the view: if
     it has moved since, the reader has taken over and we stop at once
     rather than yanking them back. */
  var done = false, mine = -1;
  function go(){
    if(done) return;
    var at = Math.round(window.scrollY || 0);
    if(mine >= 0 && Math.abs(at - mine) > 4){ done = true; return; }
    var max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    var target = Math.min(y, max);
    if(Math.abs(at - target) > 1) window.scrollTo(0, target);
    mine = Math.round(window.scrollY || 0);
    if(mine >= y - 1) done = true;          /* landed; hands off from here */
  }
  go();
  requestAnimationFrame(go);
  setTimeout(go, 120);
  setTimeout(go, 350);
  setTimeout(function(){ go(); done = true; }, 800);
  window.addEventListener("load", go, {once: true});
}

/* ------------------------------------------------------------------
   Even rows

   Descriptions differ in length, so cards in a row used to end at
   different heights. Equalising the whole card via align-items:stretch
   would mean an open drawer stretched its neighbours too, so instead
   only the body — cover, text, stats, buttons — is levelled per row.
   The drawers hang below it and stay each card's own business.
------------------------------------------------------------------ */
function equalizeRows(){
  var grids = document.querySelectorAll(".grid");
  for(var g = 0; g < grids.length; g++){
    var cards = grids[g].querySelectorAll(".card"), live = [];
    for(var i = 0; i < cards.length; i++){
      if(!cards[i].offsetParent) continue;            /* inside a filtered-out era */
      var body = cards[i].querySelector(".card-body");
      if(!body) continue;
      body.style.minHeight = "";                      /* measure natural height */
      live.push([cards[i], body]);
    }
    var rows = {}, key;
    for(var j = 0; j < live.length; j++){
      key = String(Math.round(live[j][0].getBoundingClientRect().top));
      if(!rows[key]) rows[key] = [];
      rows[key].push(live[j][1]);
    }
    for(key in rows){
      if(!Object.prototype.hasOwnProperty.call(rows, key)) continue;
      var group = rows[key];
      if(group.length < 2) continue;
      var tallest = 0;
      for(var m = 0; m < group.length; m++){
        tallest = Math.max(tallest, group[m].getBoundingClientRect().height);
      }
      for(var n = 0; n < group.length; n++){
        group[n].style.minHeight = Math.ceil(tallest) + "px";
      }
    }
  }
}
var rowTimer = null;
function equalizeSoon(){
  clearTimeout(rowTimer);
  rowTimer = setTimeout(equalizeRows, 60);
}
window.addEventListener("resize", equalizeSoon);
window.addEventListener("load", equalizeSoon);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(equalizeSoon)["catch"](function(){});

/* Run a DOM swap without letting it move the page. */
function keepScroll(fn){
  var y = window.scrollY || 0;
  fn();
  function pin(){ if(Math.abs((window.scrollY || 0) - y) > 1) window.scrollTo(0, y); }
  pin();
  requestAnimationFrame(pin);
}

/* ---------- carousel ---------- */
function shotsEl(pid){ return el("shots-" + pid); }
function shotCount(pid){
  var p = projById(pid);
  return p ? slidesOf(p).length : 0;
}
function curIndex(pid){
  var s = shotsEl(pid);
  if(!s) return 0;
  var w = s.clientWidth || 1;
  return Math.max(0, Math.min(shotCount(pid) - 1, Math.round(s.scrollLeft / w)));
}
function syncCarousel(pid, i){
  var s = shotsEl(pid);
  if(!s) return;
  if(i == null) i = curIndex(pid);
  var dots = el("dots-" + pid);
  if(dots){
    for(var k=0;k<dots.children.length;k++) dots.children[k].className = (k === i ? "on" : "");
  }
  var cov = s.parentNode;
  var prev = cov.querySelector(".cov-col.prev"), next = cov.querySelector(".cov-col.next");
  if(prev) prev.disabled = (i <= 0);
  if(next) next.disabled = (i >= shotCount(pid) - 1);
}
function goTo(pid, i, smooth){
  var s = shotsEl(pid);
  if(!s) return;
  i = Math.max(0, Math.min(shotCount(pid) - 1, i));
  try{ s.scrollTo({left: i * s.clientWidth, behavior: smooth === false ? "auto" : "smooth"}); }
  catch(e){ s.scrollLeft = i * s.clientWidth; }
  syncCarousel(pid, i);
}
/* Mouse drag across the strip. Touch already scrolls natively, and hijacking
   it would cost the momentum and rubber-banding people expect. */
function wireDrag(s, pid){
  var down = false, startX = 0, startLeft = 0, moved = 0, snapWas = "", justDragged = false;

  s.addEventListener("pointerdown", function(ev){
    if(ev.pointerType !== "mouse" || ev.button !== 0) return;
    down = true; moved = 0;
    startX = ev.clientX; startLeft = s.scrollLeft;
    snapWas = s.style.scrollSnapType;
    s.style.scrollSnapType = "none";
    s.classList.add("dragging");
  });

  s.addEventListener("pointermove", function(ev){
    if(!down) return;
    var dx = ev.clientX - startX;
    if(Math.abs(dx) > moved) moved = Math.abs(dx);
    if(moved > 3){
      if(ev.pointerId != null && s.setPointerCapture){
        try{ s.setPointerCapture(ev.pointerId); }catch(e){}
      }
      ev.preventDefault();
      s.scrollLeft = startLeft - dx;
    }
  });

  function endDrag(){
    if(!down) return;
    down = false;
    s.style.scrollSnapType = snapWas || "";
    s.classList.remove("dragging");
    if(moved > 8){
      justDragged = true;
      setTimeout(function(){ justDragged = false; }, 400);
      goTo(pid, Math.round(s.scrollLeft / (s.clientWidth || 1)));
    } else {
      syncCarousel(pid);
    }
  }
  s.addEventListener("pointerup", endDrag);
  s.addEventListener("pointercancel", endDrag);
  s.addEventListener("pointerleave", endDrag);
  s.addEventListener("dragstart", function(ev){ ev.preventDefault(); });

  /* a drag that ends on a slide must not also open the viewer */
  s.addEventListener("click", function(ev){
    if(justDragged){ ev.preventDefault(); ev.stopPropagation(); justDragged = false; }
  }, true);
}

function wireCarousels(){
  var list = el("root").querySelectorAll("[data-shots]");
  for(var i=0;i<list.length;i++){
    (function(s){
      if(s.dataset.wired) return;
      s.dataset.wired = "1";
      var pid = s.dataset.shots, timer = null;
      s.addEventListener("scroll", function(){
        clearTimeout(timer);
        timer = setTimeout(function(){ syncCarousel(pid); }, 70);
      }, {passive:true});
      s.addEventListener("keydown", function(ev){
        if(ev.key === "ArrowRight"){ ev.preventDefault(); goTo(pid, curIndex(pid) + 1); }
        else if(ev.key === "ArrowLeft"){ ev.preventDefault(); goTo(pid, curIndex(pid) - 1); }
      });
      wireDrag(s, pid);
      syncCarousel(pid, 0);
    })(list[i]);
  }
}

/* ---------- lightbox ---------- */
var LB = { pid: null, i: 0 };
/* The old free-text note is gone; fold anything written there into the
   points list so no writing is lost when a copy carrying it is opened. */
function migrateRoles(){
  var moved = 0, pid;
  for(pid in (STATE.roles || {})){
    var v = (STATE.roles[pid] || "").trim();
    if(!v) continue;
    if(!STATE.points[pid]) STATE.points[pid] = [];
    var parts = v.split(/\n+/);
    for(var i=0;i<parts.length;i++){
      var line = parts[i].replace(/^[\s\u2022*-]+/, "").trim();
      if(line && STATE.points[pid].indexOf(line) < 0){ STATE.points[pid].push(line); moved++; }
    }
  }
  STATE.roles = {};
  return moved;
}

function projById(id){
  for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].id === id) return PROJECTS[i];
  return null;
}
function lbStopVideo(){
  var v = el("lb-vid");
  if(v){ try{ v.pause(); }catch(e){} }
}

/* If a browser cannot decode the clip, say so and hand over the file rather
   than leaving a dead player on screen. One retry on the WebM first. */
var VID_TRIED = 0;
function lbFallback(show, src){
  var box = el("lb-fallback"), vid = el("lb-vid");
  if(!box) return;
  if(!show){ box.hidden = true; return; }
  if(vid) vid.hidden = true;
  box.innerHTML = "This browser can\u2019t play the embedded clip."
    + (src ? '<br><a href="' + esc(src) + '" download="olympus-freespins.mp4">Download the clip</a>' : "");
  box.hidden = false;
}
function lbVideoError(){
  var p = projById(LB.pid);
  if(!p) return;
  var shots = slidesOf(p), sl = shots[LB.i], vid = el("lb-vid");
  if(!sl || sl.kind !== "video" || !vid) return;
  VID_TRIED++;
  if(VID_TRIED === 1 && sl.srcWebm){
    var alt = mediaSrc(sl.srcWebm);
    if(alt && alt !== vid.getAttribute("src")){
      vid.hidden = false;
      vid.setAttribute("src", alt);
      vid.load();
      var pl = vid.play();
      if(pl && pl["catch"]) pl["catch"](function(){});
      return;
    }
  }
  lbFallback(true, mediaSrc(sl.src));
}
/* Nearly every browser plays the H.264 MP4; the WebM covers the few builds
   shipped without proprietary codecs. */
function pickVideoSrc(sl){
  var mp4 = mediaSrc(sl.src);
  /* An embedded copy carries H.264 only; a file-based copy can fall back. */
  if(!sl.srcWebm || mp4 !== sl.src) return mp4;
  try{
    var probe = document.createElement("video");
    if(!probe.canPlayType('video/mp4; codecs="avc1.4d401f"')) return mediaSrc(sl.srcWebm);
  }catch(e){}
  return mp4;
}
function lbPaint(){
  var p = projById(LB.pid);
  if(!p) return;
  var shots = slidesOf(p), img = el("lb-img"), vid = el("lb-vid");
  if(!img || !vid || !shots.length) return;
  var sl = shots[LB.i];

  if(sl.kind === "video"){
    img.hidden = true;
    vid.hidden = false;
    lbFallback(false);
    var want = pickVideoSrc(sl);
    if(vid.getAttribute("src") !== want){
      vid.setAttribute("poster", mediaSrc(sl.poster) || "");
      vid.setAttribute("src", want);
      VID_TRIED = 0;
      vid.load();                 /* a changed src needs an explicit reload */
    }
    var play = vid.play();
    if(play && play["catch"]) play["catch"](function(){});
  } else {
    lbStopVideo();
    vid.hidden = true;
    img.hidden = false;
    img.src = mediaSrc(sl.src);
    img.alt = p.name + " screenshot";
  }

  el("lb-cap").innerHTML = "<span><b>" + esc(pname(p)) + "</b> &nbsp;&middot;&nbsp; "
    + (sl.kind === "video" ? esc(sl.label || "Gameplay clip") + " &nbsp;&middot;&nbsp; " : "")
    + (LB.i + 1) + " of " + shots.length + "</span>";
  el("lb-prev").disabled = LB.i <= 0;
  el("lb-next").disabled = LB.i >= shots.length - 1;
}
function lbOpen(pid, i){
  if(!shotCount(pid)) return;
  LB.pid = pid;
  LB.i = Math.max(0, Math.min(shotCount(pid) - 1, i || 0));
  lbPaint();
  var d = el("lb");
  if(!d) return;
  if(typeof d.showModal === "function"){ if(!d.open) d.showModal(); }
  else d.setAttribute("open", "");
}
function lbStep(step){
  var n = LB.i + step;
  if(n < 0 || n >= shotCount(LB.pid)) return;
  LB.i = n;
  lbPaint();
}
function lbTidy(){
  lbStopVideo();
  if(LB.pid) goTo(LB.pid, LB.i, false);
}
function lbClose(){
  var d = el("lb");
  if(d && d.open && typeof d.close === "function"){
    d.close();          /* the dialog's own close handler runs lbTidy */
    return;
  }
  if(d) d.removeAttribute("open");
  lbTidy();
}
/* Esc dismisses a modal dialog natively, bypassing lbClose — so the tidy-up
   has to hang off the dialog's own close event. */
function wireDialog(){
  var d = el("lb");
  if(!d || d.dataset.wired) return;
  d.dataset.wired = "1";
  d.addEventListener("close", lbTidy);
  d.addEventListener("cancel", function(){ lbStopVideo(); });
  var v = el("lb-vid");
  if(v) v.addEventListener("error", lbVideoError, true);
}

/* Root-level listeners attach to #root, which survives re-renders — so they
   are wired exactly once, or every render would stack another copy. */
var wired = false;
function bind(){
  wireCarousels();
  wireSimLinks();
  wireDialog();
  if(wired) return;
  wired = true;

  document.addEventListener("keydown", function(ev){
    var d = el("lb");
    if(!d || !d.open) return;
    if(ev.key === "ArrowRight"){ ev.preventDefault(); lbStep(1); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault(); lbStep(-1); }
  });

  el("root").addEventListener("click", function(ev){
    var t = ev.target.closest("button");
    if(!t) return;

    if(t.id === "lb-close"){ lbClose(); return; }
    if(t.id === "lb-prev"){ lbStep(-1); return; }
    if(t.id === "lb-next"){ lbStep(1); return; }
    if(t.dataset.open){ lbOpen(t.dataset.open, Number(t.dataset.i)); return; }
    if(t.dataset.step){ goTo(t.dataset["for"], curIndex(t.dataset["for"]) + Number(t.dataset.step)); return; }

    if(t.dataset.filter){
      filterEra = t.dataset.filter;
      applyFilter();
      return;
    }
    if(t.dataset.toggle){
      var d = el(t.dataset.toggle);
      if(!d) return;
      var open = d.hidden;
      d.hidden = !open;
      t.setAttribute("aria-expanded", String(open));
      return;
    }
    if(t.id === "export-viewer"){ exportViewer(); return; }
    if(t.dataset.addpt){ addPoint(t.dataset.addpt); return; }
    if(t.dataset.delpt){ deletePoint(t.dataset.delpt, Number(t.dataset.i)); return; }
    if(t.dataset.hidept){ hidePoint(t.dataset.hidept, Number(t.dataset.i)); return; }
    if(t.dataset.shot){ pickShot(t.dataset.shot); return; }
    if(t.dataset.del){
      var pid = t.dataset.del, idx = curIndex(pid);
      var off = mediaCount(projById(pid));
      if(idx < off) return;                    /* baked-in media isn't removable */
      var arr = (STATE.shots[pid] || []).slice();
      arr.splice(idx - off, 1);
      if(arr.length) STATE.shots[pid] = arr; else delete STATE.shots[pid];
      refreshCard(pid);
      if(arr.length) goTo(pid, Math.min(idx, arr.length - 1), false);
      queueSave();
      return;
    }
  });

  /* In the viewer: a horizontal drag or swipe steps through, a clean tap on the
     dark surround closes, and a tap on the image itself does neither. */
  var lbDrag = { x:0, y:0, on:false };
  el("root").addEventListener("pointerdown", function(ev){
    var d = el("lb");
    if(!d || !d.open) return;
    if(!ev.target.closest || !ev.target.closest(".lb-stage")) return;
    lbDrag.on = true; lbDrag.x = ev.clientX; lbDrag.y = ev.clientY;
  });
  el("root").addEventListener("pointerup", function(ev){
    var d = el("lb");
    if(!d || !d.open || !lbDrag.on) return;
    lbDrag.on = false;
    var dx = ev.clientX - lbDrag.x, dy = ev.clientY - lbDrag.y;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){
      lbStep(dx < 0 ? 1 : -1);
      return;
    }
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8 &&
       (ev.target === d || (ev.target.classList && ev.target.classList.contains("lb-stage")))){
      lbClose();
    }
  });
  el("root").addEventListener("dragstart", function(ev){
    if(ev.target && ev.target.id === "lb-img") ev.preventDefault();
  });

  el("root").addEventListener("input", function(ev){
    var t = ev.target;
    if(!t.dataset) return;

    if(t.dataset.edit != null){
      if(!STATE.text) STATE.text = {};
      STATE.text[t.dataset.edit] = t.textContent;
      noteEdit();
      return;
    }
    if(t.dataset.pt){
      var arr = STATE.points[t.dataset.pt];
      if(arr) arr[Number(t.dataset.pti)] = t.textContent;
      noteEdit();
      return;
    }
  });

  /* Keep pasted copy plain, and keep these fields single-paragraph. */
  function isEditable(t){
    return t && t.dataset && (t.dataset.edit != null || t.dataset.pt != null);
  }

  /* Leaving a field is what commits it — Enter blurs, so both routes land here.
     The short delay lets you tab straight to the next field without two saves. */
  el("root").addEventListener("focusout", function(ev){
    if(!isEditable(ev.target)) return;
    equalizeSoon();            /* rewritten copy can change the card's height */
    saveLocal();
    /* Always leave a commit pending. If the caret has only moved to the next
       field, commit() reschedules itself until every field is closed. */
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commit, 400);
  });
  el("root").addEventListener("paste", function(ev){
    var t = ev.target;
    if(!isEditable(t)) return;
    ev.preventDefault();
    var text = (ev.clipboardData || window.clipboardData).getData("text") || "";
    text = text.replace(/\s*\n+\s*/g, " ");
    try{ document.execCommand("insertText", false, text); }
    catch(e){ t.textContent = t.textContent + text; }
  });
  el("root").addEventListener("keydown", function(ev){
    var t = ev.target;
    if(!isEditable(t)) return;
    if(ev.key === "Enter"){
      ev.preventDefault();
      /* Enter on a results point starts the next one */
      if(t.dataset.pt){ var pid = t.dataset.pt; t.blur(); addPoint(pid); return; }
      t.blur();
    }
    if(ev.key === "Escape"){ t.blur(); }
  });
}

/* Re-render one card in place so screenshot changes show without
   losing the rest of the page's scroll position. */
function refreshCard(pid){
  var p = projById(pid);
  if(!p) return;
  var article = el("root").querySelector('.card[data-pid="' + pid + '"]');
  if(!article) return;
  var wasOpen = [];
  var ids = ["ds-" + pid, "dr-" + pid];
  for(var w = 0; w < ids.length; w++){
    var node = el(ids[w]);
    if(node && !node.hidden) wasOpen.push(ids[w]);
  }

  var tmp = document.createElement("div");
  tmp.innerHTML = card(p);
  var fresh = tmp.firstChild;
  keepScroll(function(){
    article.parentNode.replaceChild(fresh, article);
    wireCarousels();
    wireSimLinks();
    equalizeRows();
  });

  for(var r = 0; r < wasOpen.length; r++){
    var d = el(wasOpen[r]);
    if(!d) continue;
    d.hidden = false;
    var btn = fresh.querySelector('[data-toggle="' + wasOpen[r] + '"]');
    if(btn) btn.setAttribute("aria-expanded", "true");
  }
}

var MAX_SHOTS=0;function pickShot(){} function shrink(){} function queueSave(){} function noteEdit(){}function addPoint(){} function deletePoint(){} function hidePoint(){}function isEditingNow(){return false;}function buildDoc(){return "";} function commit(){} function exportViewer(){}

function setRights(editable){
  if(readOnly === !editable) return;
  readOnly = !editable;
  keepScroll(render);
}

/* ------------------------------------------------------------------
   Boot
------------------------------------------------------------------ */
loadLocal();
var movedNotes = migrateRoles();

var hosted = !!(window.claude && typeof window.claude.use === "function");
/* A viewer copy says so in the page itself and never leaves read-only.
   Inside claude.ai, assume a viewer until the platform says this person can
   edit, so an employer never sees editing controls. An un-marked local file
   is the author's own working copy and is editable outright. */
var VIEWER = !!window.__VIEWER__;
readOnly = VIEWER || hosted;
render();
restoreScroll();

if(hosted && !VIEWER){
  window.claude.use("user").then(function(u){
    if(!u || typeof u.canEdit !== "function"){ setRights(true); return null; }
    return Promise.resolve(u.canEdit()).then(function(ok){ setRights(ok !== false); });
  })["catch"](function(){ setRights(true); });

  window.claude.use("artifact").then(function(ns){
    if(ns){ artifactNS = ns; mode = "artifact"; }
  })["catch"](function(){});

  window.claude.use("downloads").then(function(ns){ downloadsNS = ns; })["catch"](function(){});
}
if(movedNotes && !readOnly) queueSave();
</script>
